        if (wk !== lastWeek){
          card = h("div",{class:"list-card"});
          box.append(h("div",{class:"list"}, h("div",{class:"list-hdr"}, wk), card));
          lastWeek = wk;
        }
        var coach = (data.coaches||[]).filter(function(c){ return c.id === s.coach_id; })[0];
        card.append(h("button",{ class:"irow tap hrow", onclick:function(){
            draft = hydrate(s); view.name = "today"; render(); window.scrollTo(0,0);
          } },
          h("div",{class:"hdate"}, fmtDate(s.session_date)),
          h("div",{class:"hmain"},
            h("div",{class:"htitle"}, s.title),
            h("div",{class:"r-3"},
              [ s.slot && s.slot !== "other" ? slotLabel(s.slot) : null,
                fmtM(s.planned_total_m||0),
                coach ? coach.display_name : null,
                s.status === "done" ? "done" : (s.status === "skipped" ? "did not run" : "planned")
              ].filter(Boolean).join(" · "))),
          s.difficulty_rating ? h("span",{class:"badge"}, s.difficulty_rating + "/5") : null,
          s.engine === "ai" ? h("span",{class:"badge ok"},"Claude") : h("span",{class:"badge"},"library"),
          h("span",{class:"chev"},"›")
        ));
      });
    }
    q.addEventListener("input", draw);
    APP.append(h("div",{class:"filters"}, q));
    APP.append(box); draw();
  }
  function weekLabel(iso){
    var d = new Date(iso + "T12:00:00Z");
    var day = d.getUTCDay(), diff = (day === 0 ? 6 : day - 1);
    d.setUTCDate(d.getUTCDate() - diff);
    return "Week of " + fmtDate(d.toISOString().slice(0,10));
  }

  // -------------------------------------------------------------- Library ---
  function renderLibrary(){
    shell("Library", true, null, { label:"Ask Claude", onclick:function(){ askClaude(null); } });
    var roles = {};
    data.library.forEach(function(x){ roles[x.role] = (roles[x.role]||0)+1; });
    var proposed = data.library.filter(function(x){ return (x.status||"active") === "proposed"; });

    var q = h("input",{type:"search",placeholder:"Search the library",value:lib.q,
      "aria-label":"Search the library"});
    var roleSel = h("select",{class:"small","aria-label":"Filter by role"},
      [h("option",{value:""},"All roles")].concat(
      Object.keys(roles).sort().map(function(r){ return h("option",{value:r}, (ROLE_LABEL[r]||r) + " (" + roles[r] + ")"); })));
    roleSel.value = lib.role;
    var focusSel = h("select",{class:"small","aria-label":"Filter by focus"},
      [h("option",{value:""},"All focuses")].concat(
      data.focuses.map(function(f){ return h("option",{value:f.key}, f.name); })));
    focusSel.value = lib.focus;

    var box = h("div",null);
    function draw(){
      lib.q = q.value; lib.role = roleSel.value; lib.focus = focusSel.value;
      clear(box);
      var hist2 = historyForRepeat({ group:"advanced", date: todayISO() });
      var S = data.settings || defaultSettings();
      var term = lib.q.toLowerCase();
      var rows = data.library.filter(function(x){
        if (!isLive(x)) return false;
        if (lib.role && x.role !== lib.role) return false;
        if (lib.focus && (x.focus_tags||[]).indexOf(lib.focus) === -1) return false;
        if (term && (x.name + " " + x.structure + " " + (x.cue||"")).toLowerCase().indexOf(term) === -1) return false;
        return true;
      }).sort(function(a,b){ return a.role.localeCompare(b.role) || a.name.localeCompare(b.name); });

      if (!rows.length){ box.append(h("div",{class:"empty"},"Nothing matches.")); return; }
      var roleCounts = {};
      data.library.forEach(function(x){
        if (!isLive(x)) return;
        var k = x.role + (x.whole_body ? ":whole" : "");
        roleCounts[k] = (roleCounts[k]||0)+1;
      });
      var card = h("div",{class:"list-card"});
      box.append(h("div",{class:"list"},
        h("div",{class:"list-hdr"}, rows.length + (rows.length === 1 ? " set" : " sets")), card));
      rows.forEach(function(x){
        var since = sessionsSinceItem(hist2, x.id);
        var win = effectiveWindow(x, roleCounts[x.role + (x.whole_body ? ":whole" : "")]||1, S);
        var locked = since < win;
        card.append(h("div",{class:"irow lrow"},
          h("div",{class:"lmain"},
            h("div",{class:"r-1"}, x.name),
            h("div",{class:"r-2"}, x.structure + (x.rest ? ", " + x.rest : "")),
            h("div",{class:"r-3"},
              [ ROLE_LABEL[x.role]||x.role,
                (x.equipment||[]).join(" + ") || "no gear",
                "used " + (x.times_used||0) + "x",
                x.last_used_on ? "last " + fmtDate(x.last_used_on) : "never used"
              ].join(" · ")),
            (locked || x.source === "ai") ? h("div",{class:"row wrap",style:{marginTop:"6px"}},
              locked ? h("span",{class:"badge warn"},
                "back in " + (win - since) + " session" + (win-since===1?"":"s")) : null,
              x.source === "ai" ? h("span",{class:"badge accent"},"Claude") : null) : null),
          h("button",{class:"small danger",onclick:function(){ askRetire(x); }},"Retire")
        ));
      });
    }
    [q,roleSel,focusSel].forEach(function(el){ el.addEventListener("input",draw); el.addEventListener("change",draw); });

    APP.append(h("div",{class:"small muted",style:{marginBottom:"14px"}},
      data.library.filter(isLive).length + " sets. " +
      "The generator only uses active sets. Retiring one keeps it in your saved trainings but stops it coming up again."));

    if (proposed.length){
      var pcard = h("div",{class:"list-card"});
      APP.append(h("div",{class:"list"},
        h("div",{class:"list-hdr"},"Claude suggests, " + proposed.length + " waiting"), pcard));
      proposed.forEach(function(x){
        pcard.append(h("div",{class:"irow lrow"},
          h("div",{class:"lmain"},
            h("div",{class:"r-1"}, x.name),
            h("div",{class:"r-2"}, x.structure + (x.rest ? ", " + x.rest : "")),
            x.cue ? h("div",{class:"r-2",style:{color:"var(--accent-text)"}}, x.cue) : null,
            x.watch_for ? h("div",{class:"r-3"}, x.watch_for) : null,
            h("div",{class:"r-3"}, (ROLE_LABEL[x.role]||x.role) + " · " + (x.focus_tags||[]).join(", ")))));
        // Keep and reject used to sit 4px apart, with no confirmation on either.
        // Now they are at opposite ends of a full width row.
        pcard.append(h("div",{class:"irow pact"},
          h("button",{class:"small good",onclick:function(){ setStatus(x,"active"); }},"Add"),
          h("button",{class:"small danger",onclick:function(){ setStatus(x,"rejected"); }},"No")));
      });
    }

    APP.append(h("div",{class:"filters"}, q, roleSel, focusSel));
    APP.append(box); draw();
  }
  function askRetire(x){
    openSheet("Retire this set?", "sm", function(body){
      body.append(
        h("p",{class:"small muted"}, "“" + x.name + "” stays in your saved trainings. It just stops coming up in new ones."),
        h("button",{class:"primary big",onclick:function(){
          closeSheet();
          mutate(function(){ return sb.from("tr_exercises").update({ active:false }).eq("id", x.id); });
        }},"Retire it"),
        h("button",{class:"big",style:{marginTop:"12px"},onclick:closeSheet},"Keep it"));
    });
  }
  // The old button picked the role from thinRoles()[0] and the focus at random
  // from every focus including the inactive ones, and told him neither.
  function askClaude(prefRole){
    var thin = thinRoles();
    var roleSel = h("select",{"aria-label":"Role"},
      Object.keys(ROLE_LABEL).filter(function(r){ return r !== "warmup"; })
        .map(function(r){ return h("option",{value:r}, ROLE_LABEL[r]); }));
    roleSel.value = prefRole || (thin.length ? thin[0].role : "main_set");
    var focusSel = h("select",{"aria-label":"Focus"},
      data.focuses.filter(function(f){ return f.active !== false; })
        .map(function(f){ return h("option",{value:f.key}, f.name); }));
    var countSel = h("select",{"aria-label":"How many"}, [3,5,8].map(function(n){
      return h("option",{value:String(n)}, n + " new sets"); }));
    countSel.value = "5";
    openSheet("Ask Claude for new sets", "med", function(body){
      body.append(
        list("What to write", listCard(
          setupRow("Role", roleSel),
          setupRow("Focus", focusSel),
          setupRow("How many", countSel)),
          "Claude writes them, you review them here. Nothing joins the rotation until you say Add."),
        h("button",{class:"primary big",disabled: busy || offline,onclick:function(){
          closeSheet();
          growLibrary(roleSel.value, focusSel.value, parseInt(countSel.value,10) || 5);
        }},"Ask Claude"),
        h("button",{class:"big",style:{marginTop:"12px"},onclick:closeSheet},"Not now"));
    });
  }
  function setStatus(x, status){
    mutate(function(){ return sb.from("tr_exercises").update({ status:status }).eq("id", x.id); });
  }

  async function growLibrary(role, focusKey, count){
    role = role || "main_set";
    // An inactive focus used to be in the draw, so Claude could be asked to
    // write sets for a focus the generator will never pick.
    var focus = data.focuses.filter(function(f){ return f.key === focusKey; })[0] ||
                data.focuses.filter(function(f){ return f.active !== false; })[0] || null;
    count = count || 5;
    busy = true; render();
    var res = await callAi("propose_sets", {
      role: role, focus: focus ? { key:focus.key, name:focus.name, what_it_trains:focus.what_it_trains } : null,
      count: count,
      existing: data.library.filter(function(x){ return x.role === role; })
        .map(function(x){ return { name:x.name, structure:x.structure }; }).slice(0,40)
    });
    busy = false;
    if (!res.ok){
      render();
      alert(FALLBACK_NOTE[res.code] || "Claude was not reachable just now. Try again in a minute.");
      return;
    }
    var rows = (res.items || []).map(function(it){
      return {
        code: it.code, name: it.name, role: role,
        family: it.family || null,
        focus_tags: it.focus_tags || (focus ? [focus.key] : []),
        strokes: it.strokes || ["freestyle"],
        equipment: it.equipment || [],
        safety_tags: it.safety_tags || [],
        structure: it.structure, distance_m: it.distance_m,
        reps: it.reps || null, rep_distance_m: it.rep_distance_m || null,
        rest: it.rest || null, rest_adv1: it.rest_adv1 || null, rest_adv2: it.rest_adv2 || null,
        effort: it.effort || null, cue: it.cue, watch_for: it.watch_for || null,
        steady_variant: it.adv1 || null, strong_variant: it.adv2 || null,
        source:"ai", created_by: session.user.id, status:"proposed"
      };
    }).filter(function(r){ return r.code && r.name && r.structure && r.cue && r.distance_m; });
    if (!rows.length){ render(); alert("Claude did not send anything usable that time. Try again."); return; }
    await mutate(function(){ return sb.from("tr_exercises").upsert(rows, { onConflict:"code", ignoreDuplicates:true }); });
    toast(rows.length + " suggestions ready to review.");
  }

  function thinRoles(){
    var S = data.settings || defaultSettings();
    var counts = {};
    data.library.forEach(function(x){
      if (isLive(x)) counts[x.role] = (counts[x.role]||0)+1;
    });
    var need = { main_set:10, technique_drill:10, kick_set:8, pull_set:8, sprint_set:6,
                 skill_set:6, turns:6, open_water:4, activation:3, cooldown:3 };
    var out = [];
    Object.keys(need).forEach(function(r){
      var have = counts[r] || 0;
      if (have < need[r]) out.push({ role:r, have:have, need:need[r] });
    });
    return out.sort(function(a,b){ return (a.have/a.need) - (b.have/b.need); });
  }

  // ------------------------------------------------------------- Insights ---
  function renderInsights(){
    shell("Insights", true);
    var recent = data.sessions.filter(function(s){ return s.status !== "skipped"; }).slice(0, 24);
    var byFocus = {};
    recent.forEach(function(s){ byFocus[s.focus_key] = (byFocus[s.focus_key]||0)+1; });
    var maxF = Math.max(1, Math.max.apply(null, [1].concat(Object.keys(byFocus).map(function(k){ return byFocus[k]; }))));

    var vols = recent.slice(0,12).reverse();
    var avgVol = vols.length ? Math.round(vols.reduce(function(a,s){ return a + (s.planned_total_m||0); },0)/vols.length) : 0;
    var aiCount = recent.filter(function(s){ return s.engine === "ai"; }).length;
    var live = data.library.filter(isLive).length;

    // With nothing saved this screen used to draw zeroes, "last 0 sessions" and
    // every focus bar at "not yet". Settings stay either way, because that is
    // where the way out lives.
    if (!data.sessions.length){
      APP.append(h("div",{class:"empty"},
        "Nothing to show yet. Save a couple of trainings and this fills in."));
    } else {
      APP.append(h("div",{class:"tiles"},
        tile("Sessions", String(data.sessions.length), "saved"),
        tile("Average", fmtM(avgVol), "last " + vols.length),
        tile("By Claude", aiCount + " of " + recent.length, "rest from the library"),
        tile("Library", String(live), "active sets")
      ));

      // Thin roles first: it is the only card on this screen he acts on.
      var thin = thinRoles();
      if (thin.length){
        var tcard = h("div",{class:"list-card"});
        thin.forEach(function(t){
          tcard.append(irow({ title: ROLE_LABEL[t.role]||t.role,
            right: h("span",{class:"badge warn"}, t.have + " of " + t.need) }));
        });
        tcard.append(irow({ title:"Ask Claude for new sets", act:true, tone:"r-accent",
          onclick:function(){ askClaude(thin[0].role); } }));
        APP.append(list("The pool is getting thin", tcard,
          "These roles have few sets, so the generator has to bring them back sooner."));
      }

      var fcard = h("div",{class:"list-card"});
      data.focuses.forEach(function(f){
        var n = byFocus[f.key] || 0;
        fcard.append(h("div",{class:"irow"},
          h("div",{class:"r-main"},
            h("div",{class:"r-2"}, f.name),
            h("div",{class:"bar",style:{marginTop:"6px"}},
              h("i",{style:{width:(n/maxF*100)+"%",opacity: n?1:0.15}}))),
          h("div",{class:"r-val"}, n ? n + "x" : "not yet")));
      });
      APP.append(list("Focus balance, last " + recent.length + " sessions", fcard));

      // The never-used list was computed and thrown away: only the count showed,
      // so the one screen that could tell him what to try next did not.
      var stale = data.library.filter(function(x){ return isLive(x) && !x.last_used_on; });
      if (stale.length){
        var scard = h("div",{class:"list-card"});
        stale.slice(0,12).forEach(function(x){
          scard.append(irow({ title:x.name,
            sub:(ROLE_LABEL[x.role]||x.role) + " · " + x.structure }));
        });
        APP.append(list("Never used, " + stale.length + " of " + live, scard,
          stale.length > 12 ? "The first 12 of them." : null));
      }
      var over = data.library.filter(function(x){ return (x.times_used||0) >= 4; })
        .sort(function(a,b){ return (b.times_used||0)-(a.times_used||0); }).slice(0,8);
      if (over.length){
        var ocard = h("div",{class:"list-card"});
        over.forEach(function(x){
          ocard.append(irow({ title:x.name, val:(x.times_used||0) + "x" }));
        });
        APP.append(list("Most used", ocard));
      }
    }

    APP.append(list("Pace", h("div",{class:"list-card"},
        settingRow("Steady pace, seconds per 100 m (includes rest and you talking)","pace_steady_s_per_100"),
        settingRow("Faster pace, seconds per 100 m","pace_strong_s_per_100")),
      "Change the two pace numbers after a couple of real sessions. They are what makes the clock come out right."));

    APP.append(list("Generator", h("div",{class:"list-card"},
      settingRow("Main block, least metres","main_min_m"),
      settingRow("Main block, most metres","main_max_m"),
      settingRow("Sessions before a set can come back","no_repeat_sessions"))));

    APP.append(list("Pool view", h("div",{class:"list-card"},
        switchRow("Bigger text", ui.poolBig, function(){ ui.poolBig = !ui.poolBig; saveUi(); render(); }),
        switchRow("Night pool", ui.poolNight, function(){ ui.poolNight = !ui.poolNight; saveUi(); render(); })),
      "The deck stays black on white by default. A large light field is easier to read at arm's length in a bright hall, and a droplet on a dark screen scatters as a bright point."));

    APP.append(list("Display", h("div",{class:"list-card"},
        switchRow("Solid backgrounds", ui.solid, function(){ ui.solid = !ui.solid; saveUi(); render(); })),
      "Turns off the blur behind the top bar and the tab bar."));

    APP.append(list("Account", h("div",{class:"list-card"},
      h("div",{class:"irow"},
        h("div",{class:"r-main"},
          h("div",{class:"r-1"}, coachRow ? coachRow.display_name : (session ? session.user.email : "")),
          session ? h("div",{class:"r-3"}, session.user.email) : null)),
      irow({ title:"Log out", act:true, tone:"r-danger", onclick:signOut }))));
  }
  function settingRow(label, key){
    var S = data.settings || defaultSettings();
    var inp = h("input",{ class:"small", type:"number", inputmode:"numeric",
      "aria-label":label, value:String(S[key]), style:{width:"92px",textAlign:"right"} });
    inp.addEventListener("change", function(){
      var v = parseInt(inp.value,10);
      if (!isFinite(v)) return;
      var patch = {}; patch[key] = v;
      mutate(function(){ return sb.from("tr_settings").update(patch).eq("id",1); });
    });
    return h("div",{class:"irow"},
      h("div",{class:"r-main"}, h("div",{class:"r-2"}, label)), inp);
  }

  // ==========================================================================
  // boot
  // ==========================================================================
  async function boot(){
    if (!configured || !window.supabase){ render(); return; }
    clear(APP);
    APP.append(h("div",{class:"empty"},"Loading…"));

    var sres = await sb.auth.getSession();
    session = (sres.data && sres.data.session) || null;

    sb.auth.onAuthStateChange(function(_e, ns){
      var had = !!session;
      session = ns || null;
      if (!!session !== had){
        if (!session){ notCoach = false; render(); return; }
        loadAll().then(afterLoad).catch(function(){ afterLoadFailed(); });
      }
    });

    // These three used to sit after the early return, so a coach who signed in
    // from the login screen got no focus, online or offline handling at all
    // until the next cold start.
    window.addEventListener("focus", refresh);
    window.addEventListener("online", function(){ refresh(); });
    window.addEventListener("offline", function(){ offline = true; render(); });
    if (!session){ render(); return; }
    try{ await loadAll(); afterLoad(); }
    catch(e){ console.warn(e); afterLoadFailed(e); }
  }
  function afterLoad(){
    coachRow = (data.coaches||[]).filter(function(c){ return c.id === session.user.id; })[0] || null;
    notCoach = !coachRow;
    // if the library came back empty while signed in, RLS is blocking us
    if (!notCoach && !data.library.length && !data.focuses.length) notCoach = false;
    var t = todayISO();
    var todays = data.sessions.filter(function(s){ return s.session_date === t; })[0];
    if (todays && !draft) draft = hydrate(todays);
    render();
  }
  function afterLoadFailed(e){
    // no network, or the project is paused. Fall back to the phone's copy.
    var ok = loadMirror();
    if (ok){
      coachRow = (data.coaches||[]).filter(function(c){ return c.id === session.user.id; })[0] || null;
      render();
      return;
    }
    clear(APP);
    APP.append(h("div",{class:"card stack"},
      h("h2",null,"Can't reach the database"),
      h("p",{class:"muted"},"Either there is no connection, or the Supabase project has gone to sleep. Free projects pause after about a week of no use: open the Supabase dashboard and press Restore, then come back."),
      e ? h("div",{class:"err"}, String(e.message || e)) : null,
      h("div",{class:"row"},
        h("button",{class:"primary",onclick:function(){ boot(); }},"Try again"),
        h("button",{class:"ghost",onclick:signOut},"Log out"))));
  }

  // ==========================================================================
  // Test and debug seam. verify.js in this repo drives the engine through this
  // without a browser and without a database, which is how the 20-session
  // no-repeat and clock checks run. Harmless in the app: it exposes functions,
  // not data the coach cannot already see on screen.
  // ==========================================================================
  window.WSTRAIN_ENGINE = {
    buildSkeleton: buildSkeleton, validate: validate, costBlocks: costBlocks,
    setReps: setReps, renderLine: renderLine, pickFocus: pickFocus,
    pickForRole: pickForRole, effectiveWindow: effectiveWindow,
    historyForRepeat: historyForRepeat, sessionsSinceItem: sessionsSinceItem,
    sessionsSinceFamily: sessionsSinceFamily, blocksToItems: blocksToItems,
    asPlainText: asPlainText, defaultSettings: defaultSettings,
    ARCHETYPES: ARCHETYPES, FOCUS_ARCHETYPES: FOCUS_ARCHETYPES,
    ROLE_LABEL: ROLE_LABEL, prosePasses: prosePasses, applyAi: applyAi,
    data: data,
    setData: function(d){ Object.keys(d).forEach(function(k){ data[k] = d[k]; }); },
    // lets a session card be drawn without a database, for eyeballing the
    // layout and for the screenshot check in verify
    renderCard: renderSessionCard,
    clearApp: function(){ clear(APP); },

    // The harness also has to draw every view, not just check the numbers.
    // render() gates on a handful of closure variables (is there a login, is
    // there a draft, which tab is open), so the harness gets one setter for
    // those and then calls render() itself. Nothing here draws anything the
    // coach cannot already see, and nothing here is reachable from the UI.
    render: render,
    startPool: startPool,
    hydrate: hydrate,
    setUi: function(u){
      if ("configured" in u)  configured  = !!u.configured;
      if ("sb" in u)          sb          = u.sb;
      if ("session" in u)     session     = u.session;
      if ("coachRow" in u)    coachRow    = u.coachRow;
      if ("notCoach" in u)    notCoach    = !!u.notCoach;
      if ("offline" in u)     offline     = !!u.offline;
      if ("staleMirror" in u) staleMirror = !!u.staleMirror;
      if ("loginError" in u)  loginError  = u.loginError || "";
      if ("busy" in u)        busy        = !!u.busy;
      if ("generating" in u)  generating  = !!u.generating;
      if ("draft" in u)       draft       = u.draft;
      if ("view" in u)        view.name   = u.view;
    }
  };

  boot();
})();
</script>
<script>
  // Installable-app service worker (no-op on file://; only runs over https).
  if ("serviceWorker" in navigator) {
    window.addEventListener("load", function(){ navigator.serviceWorker.register("sw.js").catch(function(){}); });
  }
</script>

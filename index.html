<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="W&S Trainings">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#f2f2f7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="manifest" href="manifest.webmanifest">
<title>W&S Training Generator</title>
<style>
  /* One file, two registers. Structure tokens are mode independent, themed
     surfaces follow the phone, and the pool literals follow nothing at all:
     pool view is the only screen read at arm's length in a bright hall with wet
     hands, so it never themes and never takes glass. Every ratio in a comment
     below was computed from WCAG relative luminance with alpha composited.
     Body text clears 7:1 on every surface it can land on. */
  :root{
    color-scheme: light dark;

    /* radii. Concentric: inner = outer minus the gap, floored at 0. */
    --r-sheet:20px; --r-card:14px; --r-inner:10px; --r-ctl:11px; --r-pill:999px;
    --r-pool:16px;

    /* spacing, 8px base with 4px half steps */
    --s-1:4px; --s-2:8px; --s-3:12px; --s-4:16px; --s-5:20px; --s-6:24px;
    --gutter:16px;        /* one alignment column for title, lists and cards */
    --group-gap:28px;     /* between two grouped inset lists */

    /* 44px is the floor for anything you tap, not the target. */
    --ctl-h:44px;
    --ctl-h-lg:56px;      /* the one primary action on a screen */
    --tabbar-h:49px;
    --topbar-h:44px;

    /* Type. The iOS ladder in exact pixels at the 16px default root, so the
       app reads native today. If Vlad approves Dynamic Type later, the
       single line `:root{font:-apple-system-body}` makes 1rem 17px and the
       whole ladder grows 6% together. */
    --fs-title-lg:2.125rem;  /* 34 */
    --fs-title-1:1.75rem;    /* 28 */
    --fs-title-2:1.375rem;   /* 22 */
    --fs-title-3:1.25rem;    /* 20 */
    --fs-body:1.0625rem;     /* 17 */
    --fs-callout:1rem;       /* 16 */
    --fs-sub:.9375rem;       /* 15 */
    --fs-foot:.8125rem;      /* 13 */
    --fs-cap:.75rem;         /* 12 */
    --fs-cap-2:.6875rem;     /* 11 */

    /* one z table, no ad hoc numbers */
    --z-topbar:30; --z-tabbar:40; --z-scrim:60; --z-sheet:61;
    --z-toast:100; --z-pool:200; --z-pool-toast:210;

    --dur-fast:120ms; --dur-mid:250ms; --dur-sheet:340ms;
    --ease-out:cubic-bezier(.2,.8,.3,1);
    --ease-sheet:cubic-bezier(.32,.72,0,1);
  }

  /* ---------- themed surfaces: light ---------- */
  :root{
    --bg-grouped:#f2f2f7;
    --bg-card:#ffffff;
    --bg-nested:#f2f2f7;
    --bg-sheet:#f2f2f7;

    /* Three label levels, each measured against white AND against the
       grouped grey, because both sit behind text somewhere. --label-3 is for
       placeholders, chevrons and disabled glyphs, where 4.6 is fine because
       nothing is read from it. */
    --label:#13212b;      /* 16.40 on card, 14.70 on grouped */
    --label-2:#414e58;    /* 8.55 on card, 7.66 on grouped */
    --label-3:#636f7b;    /* 5.13 / 4.60, never body text */
    --on-fill:#3a4650;    /* 8.41 on a fill over card, 7.57 over grouped */

    --sep:rgba(60,60,67,.29);   /* flattens to #c6c6c8 */
    --sep-opaque:#c6c6c8;
    --fill-1:rgba(120,120,128,.20);
    --fill-2:rgba(120,120,128,.16);
    --fill-3:rgba(118,118,128,.12);
    --fill-4:rgba(116,116,128,.08);

    /* The accent is split by job. White on #0284c7 is 4.10, which fails AA,
       so every primary button in the old design was below the standard.
       Fills and coloured text use the darker one, where white reaches 7.56. */
    --accent:#0284c7;
    --accent-text:#075985;      /* 7.56 on card, 7.32 on flattened glass */
    --accent-fill:#075985;      /* white on it 7.56 */
    --accent-tint:#e0f2fe;
    --accent-line:#9ecfea;      /* decoration on a tint, not a boundary */

    --good:#155c33; --good-fill:#155c33; --good-tint:#dcfce7; --good-line:#8fd0a6;
    --warn:#743e00; --warn-tint:#fff7ed; --warn-line:#e3b478;
    --bad:#9f1a1a;  --bad-tint:#fef2f2;  --bad-line:#e8a3a3;

    /* Split by job, like the accent. --good is text on a tint, so it goes pale
       in dark. --good-fill is a filled button, so it stays dark in both and
       keeps white ink: a pale fill makes Save the loudest thing on the card. */
    --on-accent:#ffffff; --on-good:#ffffff;

    /* glass, the functional layer. Two elements on screen, no more. */
    --glass-fill:rgba(255,255,255,.72);
    --glass-rim:rgba(255,255,255,.70);   /* inset top, the specular highlight */
    --glass-edge:rgba(0,0,0,.10);        /* 1px outer, the darkened edge */
    --glass-drop:0 6px 20px rgba(0,0,0,.10), 0 1px 2px rgba(0,0,0,.06);
    --glass-blur:20px;
    --glass-flat:#fbfbfd;                /* the same fill flattened */

    --scrim:rgba(0,0,0,.40);
    --shadow-card:0 1px 2px rgba(16,42,58,.05);
    --shadow-sheet:0 -12px 40px rgba(0,0,0,.28);
  }

  /* ---------- themed surfaces: dark ---------- */
  @media (prefers-color-scheme: dark){
    :root{
      /* The inversion that catches people out: grouped is lighter than card in
         light mode and darker than card in dark mode. */
      --bg-grouped:#000000;
      --bg-card:#1c1c1e;
      --bg-nested:#2c2c2e;
      --bg-sheet:#1c1c1e;

      --label:#ffffff;      /* 17.01 on card, 21.00 on grouped */
      --label-2:#b0b9c1;    /* 8.55 on card, 7.01 on nested */
      --label-3:#949ea8;    /* 6.25 / 5.12 */
      --on-fill:#c3cbd2;    /* 7.78 on a fill over card, 10.36 over grouped */

      --sep:rgba(84,84,88,.65);
      --sep-opaque:#404044;
      --fill-1:rgba(120,120,128,.36);
      --fill-2:rgba(120,120,128,.32);
      --fill-3:rgba(118,118,128,.24);
      --fill-4:rgba(118,118,128,.18);

      --accent:#5cc4f5; --accent-text:#5cc4f5; --accent-fill:#0c5c86;
      --accent-tint:#213844; --accent-line:#3b6d87;

      --good:#8ce8b2; --good-fill:#14663a; --good-tint:#2e4037; --good-line:#4c7a5e;
      --warn:#f5c377; --warn-tint:#42382b; --warn-line:#7d6640;
      --bad:#ffada8;  --bad-tint:#453434;  --bad-line:#8a5b58;

      /* Both fills stay dark here, so both keep white ink: 7.26 and 7.02. */
      --on-accent:#ffffff; --on-good:#ffffff;

      --glass-fill:rgba(28,28,30,.72);
      --glass-rim:rgba(255,255,255,.16);
      --glass-edge:rgba(0,0,0,.60);
      --glass-drop:0 6px 20px rgba(0,0,0,.50), 0 1px 2px rgba(0,0,0,.35);
      --glass-flat:#141416;

      --scrim:rgba(0,0,0,.60);
      --shadow-card:none;   /* dark mode separates by fill and border, not shadow */
      --shadow-sheet:0 -12px 40px rgba(0,0,0,.60);
    }
  }

  /* Pool literals, hoisted to :root and NOT into the dark block, because the
     pool toast mounts outside #pool and could never inherit from it. Dark mode
     does not reach in here: a large light field constricts the pupil, which
     lifts what he can resolve, and a droplet on a dark screen scatters as a
     bright point. There is a manual Night pool switch instead. */
  :root{
    --p-ink:#000; --p-paper:#fff;
    --p-done-fill:#e8ecef;      /* black on it is 17.68, so it decorates only */
    --p-behind-ink:#fff; --p-behind-fill:#000;   /* late inverts, it does not go red */
    --p-border:3px;
  }

  /* Reduce Transparency and Increase Contrast are two different requests, so
     they get separate blocks, and the dark override is separate again. Bundle
     them and light-mode label hexes land on a dark card: #000000 on #1c1c1e
     measures 1.24. Never put a label hex in the shared block. */
  @media (prefers-contrast: more), (prefers-reduced-transparency: reduce){
    :root{
      --sep:var(--sep-opaque); --shadow-card:none;
      --glass-fill:var(--glass-flat); --glass-blur:0px;
      --glass-edge:var(--sep-opaque); --glass-drop:none; --glass-rim:transparent;
      --scrim:rgba(0,0,0,.70);
    }
    /* A dark card differs from the page by 1.24, so once the shadow is gone
       the border is the only thing left holding the edge. */
    .card,.list-card,.blk,.tile,.goalbox,.sheet{ border:1px solid var(--label-3); }
  }
  @media (prefers-contrast: more){
    :root{ --label:#000000; --label-2:#2b343c; --label-3:#4a545e; --on-fill:#2b343c; }
  }
  @media (prefers-color-scheme: dark) and (prefers-contrast: more){
    :root{ --label:#ffffff; --label-2:#dfe4e8; --label-3:#b9c1c8; --on-fill:#dfe4e8; }
  }
  /* Same request, reachable without the OS setting: a switch in Settings. */
  body.solid .glass{
    background:var(--glass-flat);
    -webkit-backdrop-filter:none; backdrop-filter:none;
    box-shadow:none; border-bottom-color:var(--sep-opaque);
  }
  body.solid .card,body.solid .list-card,body.solid .tile{ box-shadow:none; }

  @media (prefers-reduced-motion: reduce){
    *,*::before,*::after{
      transition-duration:.01ms !important; animation-duration:.01ms !important;
      animation-iteration-count:1 !important; scroll-behavior:auto !important;
    }
  }

  /* Base */
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  /* Rubber-banding the page behind a fixed overlay shows the page
     underneath, which on the deck is a flash of the wrong register. */
  html{overscroll-behavior-y:none;-webkit-text-size-adjust:100%;}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    font-size:var(--fs-body); line-height:1.294;
    background:var(--bg-grouped); color:var(--label);
    -webkit-tap-highlight-color:transparent;
  }
  /* Safe area lives on each fixed element, not on body: padding on body does
     nothing for a position:fixed child and doubles up with the bar. All four
     insets, so landscape on a notched phone still clears the sensor housing. */
  body>.wrap{
    max-width:860px; margin:0 auto;
    padding-left:max(var(--gutter),env(safe-area-inset-left));
    padding-right:max(var(--gutter),env(safe-area-inset-right));
    padding-top:calc(env(safe-area-inset-top) + var(--topbar-h) + var(--s-2));
    padding-bottom:calc(var(--tabbar-h) + max(env(safe-area-inset-bottom),8px) + var(--s-6));
  }
  .largetitle{
    font-size:var(--fs-title-lg); line-height:1.206; font-weight:700;
    margin:var(--s-2) 0 var(--s-4); letter-spacing:.004em;
  }
  .gone{ display:none !important; }
  [hidden]{ display:none !important; }   /* flex beats the UA rule, so restate it */

  /* The shell: one glass top bar, one glass tab bar, and that is the whole
     glass budget. backdrop-filter on a fixed element repaints the blurred
     region every scroll frame, so a third one buys jank and nothing visual. */
  .glass{
    background:var(--glass-fill);
    -webkit-backdrop-filter:blur(var(--glass-blur)) saturate(180%);
    backdrop-filter:blur(var(--glass-blur)) saturate(180%);
    border:0; border-bottom:1px solid var(--glass-edge);
    box-shadow:inset 0 1px 0 0 var(--glass-rim), var(--glass-drop);
  }
  @supports not ((backdrop-filter:blur(1px)) or (-webkit-backdrop-filter:blur(1px))){
    .glass{ background:var(--glass-flat); }
  }
  .topbar{
    position:fixed; left:0; right:0; top:0; z-index:var(--z-topbar);
    display:flex; align-items:center; gap:var(--s-2);
    min-height:calc(env(safe-area-inset-top) + var(--topbar-h));
    padding:env(safe-area-inset-top)
            max(var(--s-2),env(safe-area-inset-right)) 0
            max(var(--s-2),env(safe-area-inset-left));
    transition:background var(--dur-mid) var(--ease-out);
  }
  /* Until the large title has scrolled away the bar has nothing to separate,
     so it carries no material at all. Body-scoped so it ties with
     body.solid .glass on specificity and wins on order. */
  body .topbar:not(.compact){
    background:transparent; -webkit-backdrop-filter:none; backdrop-filter:none;
    border-bottom-color:transparent; box-shadow:none;
  }
  .topbar-title{
    flex:1; text-align:center; min-width:0;
    font-size:var(--fs-body); font-weight:600;
    overflow:hidden; text-overflow:ellipsis; white-space:nowrap;
    opacity:0; transition:opacity var(--dur-mid) var(--ease-out);
  }
  .topbar.compact .topbar-title{ opacity:1; }
  .barbtn{
    min-height:var(--ctl-h); min-width:var(--ctl-h); padding:0 var(--s-3);
    border:0; background:transparent; color:var(--accent-text);
    font-size:var(--fs-body); font-weight:600; border-radius:var(--r-ctl);
    flex:none;
  }
  .barbtn:active{ background:var(--fill-3); }

  .tabbar{
    position:fixed; left:0; right:0; bottom:0; z-index:var(--z-tabbar);
    display:flex; align-items:stretch;
    padding-bottom:max(env(safe-area-inset-bottom),8px);
    padding-left:env(safe-area-inset-left); padding-right:env(safe-area-inset-right);
    border-bottom:0; border-top:1px solid var(--glass-edge);
    -webkit-user-select:none; user-select:none;
    transition:transform var(--dur-mid) var(--ease-out);
  }
  /* A fixed bottom bar sits behind the iOS keyboard, so it steps out of the
     way while a field has focus. Driven by a class on body from focusin and
     focusout, never from visualViewport. */
  body.kbd .tabbar{ transform:translateY(110%); }
  .tab{
    flex:1; min-height:var(--tabbar-h); min-width:0;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    gap:2px; padding:6px 2px 2px;
    border:0; background:none; color:var(--label-2);
    -webkit-tap-highlight-color:transparent; touch-action:manipulation;
  }
  .tab:active{ opacity:.55; }
  .tab svg{ width:28px; height:28px; flex:none; }
  .tab .lbl{
    font-size:var(--fs-cap-2); line-height:1.2; font-weight:500;
    text-transform:none; letter-spacing:0; color:inherit;
  }
  /* The glyph may carry the accent, which is a 3:1 non text colour. #0284c7
     on flattened light glass is 3.96, so the label takes --accent-text at
     7.32 instead. */
  .tab.on{ color:var(--accent); }
  .tab.on .lbl{ color:var(--accent-text); }

  /* ---------- sheets ---------- */
  .scrim{
    position:fixed; inset:0; z-index:var(--z-scrim); background:var(--scrim);
    opacity:0; pointer-events:none; transition:opacity var(--dur-mid) ease;
  }
  .scrim.on{ opacity:1; pointer-events:auto; }
  .sheet{
    position:fixed; left:0; right:0; bottom:0; z-index:var(--z-sheet);
    display:flex; flex-direction:column; overflow:hidden;
    max-height:92dvh;
    border-radius:var(--r-sheet) var(--r-sheet) 0 0;
    background:var(--bg-sheet); color:var(--label);
    box-shadow:var(--shadow-sheet);
    transform:translateY(101%);
    transition:transform var(--dur-sheet) var(--ease-sheet);
    padding-bottom:max(env(safe-area-inset-bottom),12px);
    padding-left:env(safe-area-inset-left); padding-right:env(safe-area-inset-right);
  }
  .sheet.on{ transform:translateY(0); }
  .sheet.med{ max-height:62dvh; }
  /* A sheet that holds a field stays short, so the iOS keyboard cannot cover
     the field it was opened for. */
  .sheet.sm{ max-height:44dvh; }
  .grabber{
    width:36px; height:5px; border-radius:2.5px; margin:6px auto 0;
    background:var(--label-3); flex:none;
  }
  .sheet-head{
    flex:none; padding:var(--s-3) var(--gutter) var(--s-2);
    font-size:var(--fs-title-2); font-weight:700;
  }
  /* flex plus min-height:0 is what makes the body the part that scrolls
     instead of the sheet growing past its own max-height. */
  .sheet-body{
    flex:1 1 auto; min-height:0;
    overflow-y:auto; overscroll-behavior:contain;
    padding:0 var(--gutter) var(--s-4);
  }

  /* Controls. Everything tappable clears 44px, and feedback is on :active:
     a phone has no hover, and iOS leaves hover stuck on the last thing you
     touched. */
  button{
    font:inherit; font-weight:600; cursor:pointer;
    display:inline-flex; align-items:center; justify-content:center; gap:6px;
    min-height:var(--ctl-h); padding:.6em 1.1em;
    border:1px solid var(--sep-opaque); border-radius:var(--r-ctl);
    background:var(--bg-card); color:var(--label);
    -webkit-appearance:none; appearance:none;
    -webkit-tap-highlight-color:transparent; touch-action:manipulation;
    -webkit-user-select:none; user-select:none;
    transition:background var(--dur-fast) var(--ease-out),
               transform var(--dur-fast) var(--ease-out);
  }
  button:active{background:var(--fill-2);transform:scale(.97);}
  button:disabled{opacity:.4;cursor:default;transform:none;}
  button:focus-visible{outline:3px solid var(--accent);outline-offset:2px;}
  button.primary{background:var(--accent-fill);border-color:var(--accent-fill);color:var(--on-accent);}
  /* --accent-fill is dark in both modes, so brightening is the visible
     direction. #0c5c86 on #1c1c1e is 2.34, and --accent-line is already
     #3b6d87, which clears 3:1 on card and on page. */
  button.primary:active{background:var(--accent-text);filter:brightness(1.15);}
  button.good{background:var(--good-fill);border-color:var(--good-fill);color:var(--on-good);}
  button.plain{background:transparent;border-color:transparent;color:var(--accent-text);}
  button.plain:active{background:var(--fill-3);}
  button.ghost{background:transparent;border-color:transparent;color:var(--label-2);}
  button.ghost:active{background:var(--fill-3);color:var(--label);}
  button.danger{color:var(--bad);border-color:transparent;background:transparent;}
  button.danger:active{background:var(--bad-tint);}
  /* Still a 44px target, just a smaller label on it. The five rating buttons
     are one character each, so the minimum width is load bearing. */
  button.small{font-size:var(--fs-sub);padding:0 12px;min-width:64px;border-radius:var(--r-inner);}
  button.big{min-height:var(--ctl-h-lg);width:100%;padding:0 22px;
        font-size:var(--fs-body);font-weight:600;border-radius:var(--r-card);}
  @media (prefers-color-scheme: dark){
    button.primary{border-color:var(--accent-line);}
  }
  /* Only where a real pointer exists, because on iOS a bare :hover sticks to
     the last thing you touched and reads as a control that never let go. */
  @media (hover:hover) and (pointer:fine){
    button:hover{background:var(--fill-3);}
    button.primary:hover{filter:brightness(1.08);}
    .irow.tap:hover{background:var(--fill-4);}
  }

  input,select,textarea{
    font:inherit;color:var(--label);background:var(--bg-card);
    /* rgba(60,60,67,.29) over white flattens to #c6c6c8, which is 1.71
       against the field's own fill, so there is no perceivable boundary at
       all. Where the border is the only thing identifying the control it has
       to clear 3:1, so the default is --label-3 at 5.13 light, 6.25 dark. */
    border:1px solid var(--label-3);border-radius:var(--r-ctl);
    min-height:var(--ctl-h);padding:10px 12px;
    -webkit-appearance:none; appearance:none;
  }
  /* Inside a grouped row the row identifies the control, so the field steps
     back to a hairline. */
  .irow input,.irow select{border-color:var(--sep-opaque);}
  textarea{width:100%;min-height:88px;resize:vertical;line-height:1.35;}
  input:focus,select:focus,textarea:focus{outline:3px solid var(--accent);outline-offset:1px;border-color:var(--accent);}
  /* appearance:none takes the caret off a select, and the caret is the only
     thing that says the row opens a picker, so draw it back with two
     gradients. No asset, no font. */
  select{
    padding-right:30px;
    background-image:linear-gradient(45deg,transparent 50%,var(--label-3) 50%),
                     linear-gradient(135deg,var(--label-3) 50%,transparent 50%);
    background-position:calc(100% - 16px) calc(50% - 2px),calc(100% - 11px) calc(50% - 2px);
    background-size:6px 6px,6px 6px;
    background-repeat:no-repeat;
  }
  select.small,input.small{font-size:var(--fs-sub);padding:0 10px;}
  select.small{padding-right:30px;}
  input::placeholder,textarea::placeholder{color:var(--label-3);}

  /* segmented control, for the 1 to 5 rating */
  .seg{display:flex;background:var(--fill-3);border-radius:var(--r-ctl);padding:2px;gap:2px;}
  .seg button{flex:1;min-width:44px;min-height:var(--ctl-h);padding:0;border:0;
        border-radius:calc(var(--r-ctl) - 2px);background:transparent;color:var(--label);}
  /* A white pill on a light track is a 1.15 state indicator, which is not a
     state indicator. The chosen cell takes the accent fill at 7.56. */
  .seg button.primary{background:var(--accent-fill);color:var(--on-accent);box-shadow:none;}
  .seg button:active{background:var(--fill-1);transform:none;}

  /* iOS switch. White knob on --good-fill is 7.02, so the state reads without
     colour vision: the knob moves as well as the track filling. */
  .sw{
    flex:none;width:51px;min-width:51px;height:31px;min-height:31px;padding:0;
    border:1px solid var(--sep-opaque);border-radius:var(--r-pill);
    background:var(--fill-1);position:relative;
  }
  .sw i{
    display:block;width:27px;height:27px;border-radius:var(--r-pill);
    background:#ffffff;box-shadow:0 1px 3px rgba(0,0,0,.25);
    position:absolute;top:1px;left:1px;
    transition:transform var(--dur-fast) var(--ease-out);
  }
  .sw.on{background:var(--good-fill);border-color:var(--good-fill);}
  .sw.on i{transform:translateX(20px);}
  .sw:active{transform:none;}

  /* Surfaces */
  .card{
    background:var(--bg-card);border:1px solid var(--sep);border-radius:var(--r-card);
    padding:var(--s-4);margin-bottom:var(--s-4);box-shadow:var(--shadow-card);
  }
  .card h2{margin:0 0 2px;font-size:var(--fs-title-2);line-height:1.273;}
  .row{display:flex;align-items:center;gap:10px;}
  .row.wrap{flex-wrap:wrap;}
  .muted{color:var(--label-2);}
  .small{font-size:var(--fs-sub);}
  .tiny{font-size:var(--fs-foot);}
  .stack>*+*{margin-top:10px;}
  .section-label{font-size:var(--fs-cap);font-weight:700;text-transform:uppercase;
        letter-spacing:.05em;color:var(--label-2);margin:0 0 8px;}
  .empty{text-align:center;color:var(--label-2);padding:26px 10px;}
  /* Was an inline #f5f8fa, which is near white behind white text in dark mode. */
  .codeblock{
    background:var(--bg-nested);border:1px solid var(--sep);
    padding:10px;border-radius:var(--r-inner);overflow-x:auto;
  }
  pre{margin:0;font-size:var(--fs-foot);}

  /* The login fields used to size themselves to their placeholder text, so
     on a phone they sat at about 60% of the width with the button stranded
     beside them. One screen, so the rule is scoped to it. */
  .login input{width:100%;}
  .login .row{display:block;}
  .login .row button{width:100%;min-height:var(--ctl-h-lg);}

  /* Grouped inset list. The row + row::before hairline is a true half pixel
     on retina and needs no last-child exception, which matters because there
     is no querySelectorAll to fix up separators from script. */
  .list{margin:0 0 var(--group-gap);}
  .list-hdr{font-size:var(--fs-foot);line-height:1.385;font-weight:600;
        text-transform:uppercase;letter-spacing:.06em;color:var(--label-2);
        padding:0 var(--s-4) 7px;margin:0;}
  .list-ftr{font-size:var(--fs-foot);line-height:1.385;color:var(--label-2);
        padding:7px var(--s-4) 0;margin:0;}
  .list-card{background:var(--bg-card);border:1px solid var(--sep);
        border-radius:var(--r-card);box-shadow:var(--shadow-card);overflow:hidden;}
  .irow{
    position:relative;display:flex;align-items:center;justify-content:flex-start;
    gap:var(--s-3);
    width:100%;min-height:var(--ctl-h);padding:9px var(--s-4);
    background:transparent;border:0;border-radius:0;
    color:var(--label);text-align:left;font-weight:400;flex-wrap:wrap;
    -webkit-tap-highlight-color:transparent;
  }
  .irow+.irow::before{
    content:"";position:absolute;left:var(--s-4);right:0;top:0;height:1px;
    background:var(--sep);transform:scaleY(.5);transform-origin:top;
  }
  .irow:active{transform:none;}
  .irow.tap{cursor:pointer;touch-action:manipulation;}
  .irow.tap:active{background:var(--fill-3);}
  .irow .r-main{flex:1 1 auto;min-width:0;}
  .irow .r-1{font-size:var(--fs-body);font-weight:600;}
  .irow .r-2{font-size:var(--fs-sub);color:var(--label-2);}
  .irow .r-3{font-size:var(--fs-foot);color:var(--label-2);}
  .irow .r-val{margin-left:auto;color:var(--label-2);font-size:var(--fs-body);
        font-variant-numeric:tabular-nums;flex:none;}
  /* Row tones are named r-* on purpose. A .good on a row would be outranked
     by button.good, which is a type plus a class, and in light mode that
     paints #155c33 text on a #155c33 fill at 1.00. */
  .irow.r-good .r-1{color:var(--good);}
  .irow.r-danger .r-1{color:var(--bad);}
  .irow.r-accent .r-1{color:var(--accent-text);}
  .chev{flex:none;width:9px;height:15px;color:var(--label-3);}
  .irow.act{justify-content:center;font-weight:600;}
  .irow.act .r-1{text-align:center;}
  /* A native date input or select inside a row is the iOS picker sheet for
     free, so the row carries the real control instead of a fake value line. */
  .irow>input,.irow>select{margin-left:auto;flex:0 1 auto;min-width:0;max-width:64%;}
  /* Keep and reject at opposite ends of a full width row. They used to sit
     4px apart, which is inside one sigma of a wet finger. */
  .irow.pact{justify-content:space-between;gap:var(--s-6);}

  .err{background:var(--bad-tint);color:var(--label);border:1px solid var(--bad-line);
        border-radius:var(--r-inner);padding:8px 10px;font-size:var(--fs-sub);margin-top:8px;}
  /* Banners: the tint and the border carry the meaning and the words stay at
     --label. Semantic ink on its own tint runs 6.2 to 8.1 depending on the
     pair, and the message is body text, so it gets 14.3 or better instead. */
  .banner{background:var(--warn-tint);color:var(--label);border:1px solid var(--warn-line);
        border-radius:var(--r-inner);padding:10px var(--s-3);font-size:var(--fs-callout);
        margin-bottom:var(--s-3);}
  .banner.ok{background:var(--good-tint);border-color:var(--good-line);}
  .banner.info{background:var(--accent-tint);border-color:var(--accent-line);}
  /* Offline runs edge to edge under the large title, so the negative margin
     has to cancel exactly the padding the wrap used, insets included. */
  .banner.edge{
    border-radius:0;border-left:0;border-right:0;
    margin-top:0;margin-bottom:var(--s-3);
    margin-left:calc(max(var(--gutter),env(safe-area-inset-left)) * -1);
    margin-right:calc(max(var(--gutter),env(safe-area-inset-right)) * -1);
    padding-left:max(var(--gutter),env(safe-area-inset-left));
    padding-right:max(var(--gutter),env(safe-area-inset-right));
  }

  .toast{
    position:fixed;left:50%;transform:translateX(-50%);
    bottom:calc(var(--tabbar-h) + max(env(safe-area-inset-bottom),8px) + 12px);
    z-index:var(--z-toast);max-width:90%;pointer-events:none;
    background:var(--label);color:var(--bg-card);
    border-radius:var(--r-pill);padding:12px 18px;
    font-size:var(--fs-callout);font-weight:600;   /* 16.40 light, 17.01 dark */
    box-shadow:var(--glass-drop);
  }
  /* #pool is at z-index 200, so a glass-register toast was painted behind
     the deck and he never saw it. This one is above it and in its register. */
  .toast.pool{
    z-index:var(--z-pool-toast);
    bottom:calc(env(safe-area-inset-bottom) + 96px);
    background:var(--p-paper);color:var(--p-ink);
    border:var(--p-border) solid var(--p-ink);border-radius:var(--r-pool);
    font-size:var(--p-btn);box-shadow:none;
  }

  /* Stat strip. Was a 2x2 grid 202px tall, which pushed Start pool view off
     the first screen. One row of four recovers about 120px. */
  .tiles{display:flex;align-items:stretch;background:var(--bg-card);
        border:1px solid var(--sep);border-radius:var(--r-card);
        box-shadow:var(--shadow-card);overflow:hidden;margin-bottom:var(--s-4);}
  .tile{flex:1 1 0;min-width:0;padding:8px var(--s-2);text-align:center;
        border-left:1px solid var(--sep);}
  .tile:first-child{border-left:0;}
  .tile .lbl{font-size:var(--fs-cap-2);font-weight:700;text-transform:uppercase;
        letter-spacing:.04em;color:var(--label-2);}
  .tile .val{font-size:var(--fs-title-3);font-weight:700;margin-top:1px;
        font-variant-numeric:tabular-nums;overflow-wrap:break-word;}
  .tile .sub{font-size:var(--fs-cap-2);color:var(--label-2);margin-top:1px;
        overflow-wrap:break-word;}

  .badge{font-size:var(--fs-cap);font-weight:600;line-height:1.4;
        background:var(--fill-3);color:var(--on-fill);
        padding:3px 9px;border-radius:var(--r-pill);white-space:nowrap;}
  .badge.warn{background:var(--warn-tint);color:var(--warn);}
  .badge.ok{background:var(--good-tint);color:var(--good);}
  .badge.accent{background:var(--accent-tint);color:var(--accent-text);}

  /* ---------- session blocks ---------- */
  .blk{border:1px solid var(--sep);border-radius:var(--r-card);padding:var(--s-4);
        margin-bottom:var(--s-3);background:var(--bg-card);box-shadow:var(--shadow-card);}
  .blk .role{font-size:var(--fs-foot);font-weight:700;text-transform:uppercase;
        letter-spacing:.06em;color:var(--label-2);}
  /* The set line splits three ways by how often he looks at it: the call he
     shouts, the qualifier that finishes it, the rest he re-reads. */
  .blk .call{font-size:var(--fs-title-3);line-height:1.25;font-weight:700;margin-top:3px;}
  .blk .rest{font-size:var(--fs-body);font-weight:600;margin-top:2px;
        font-variant-numeric:tabular-nums;}
  .blk .qual{font-size:var(--fs-callout);color:var(--label-2);margin-top:2px;}
  .blk .cue{color:var(--accent-text);font-size:var(--fs-callout);margin-top:6px;}
  .blk .watch{color:var(--label-2);font-size:var(--fs-sub);margin-top:4px;}
  .blk .adv{display:flex;gap:var(--s-2);flex-wrap:wrap;margin-top:var(--s-2);}
  .blk .adv span{font-size:var(--fs-sub);background:var(--bg-nested);
        border:1px solid var(--sep);border-radius:7px;padding:3px 8px;}
  .blk .meta{margin-top:var(--s-2);display:flex;gap:var(--s-2);flex-wrap:wrap;align-items:center;}
  /* The rep pair used to sit 4px apart, which is inside one sigma of a wet
     finger. Full width row, one at each end. The negative margin matches the
     card padding exactly, so the two have to stay in step. */
  .blk .blkact{display:flex;align-items:center;justify-content:space-between;
        gap:var(--s-6);margin:var(--s-3) calc(var(--s-4) * -1) calc(var(--s-4) * -1);
        padding:var(--s-2) var(--s-4);border-top:1px solid var(--sep);}
  .blk .blkact .val{font-size:var(--fs-sub);color:var(--label-2);
        font-variant-numeric:tabular-nums;text-align:center;flex:1 1 auto;}
  .goalbox{background:var(--accent-tint);border:1px solid var(--accent-line);
        border-radius:var(--r-inner);padding:var(--s-3) var(--s-4);margin-bottom:var(--s-3);}
  .goalbox .lbl{font-size:var(--fs-cap);font-weight:700;text-transform:uppercase;
        letter-spacing:.06em;color:var(--accent-text);}
  .goalbox .txt{margin-top:3px;font-size:var(--fs-callout);color:var(--label);}

  /* ---------- history ---------- */
  .hrow{font-size:var(--fs-body);}
  .hdate{color:var(--label-2);white-space:nowrap;font-variant-numeric:tabular-nums;
        min-width:5.5em;flex-shrink:0;font-size:var(--fs-sub);}
  .hmain{flex:1 1 auto;min-width:0;}
  .htitle{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}

  /* ---------- library ---------- */
  .lrow{align-items:flex-start;}
  .lrow .lmain{flex:1 1 auto;min-width:0;}
  .filters{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:12px;}
  .filters input[type=search]{flex:1 1 auto;min-width:130px;}
  .filters select{flex:0 1 auto;}
  .bar{height:8px;background:var(--fill-3);border-radius:var(--r-pill);overflow:hidden;}
  .bar>i{display:block;height:100%;background:var(--accent);
        transition:width var(--dur-mid) var(--ease-out);}

  /* Pool view: bright hall, wet fingers, phone at arm's length. Literal black
     on literal white, never themed. The 48px call is about 26 arcmin of cap
     height at 70 cm against the ISO 9241 floor of 16. The old 1.55rem
     breakpoint was 13.9 and worked directly against the brief, so it is gone. */
  #pool{
    /* These live here, not on :root. A var() inside a custom property is
       substituted on the element that declares it, so declaring them on :root
       froze --pool-scale at 1 and the Bigger text switch did nothing. Declared
       here, #pool.big wins on the same element and the sizes really change. */
    --pool-scale:1;
    --pool-target:104px;        /* state changing, wet finger. See the note below. */
    --pool-target-sm:76px;      /* reversible pool control */
    --p-call:calc(48px * var(--pool-scale));
    --p-rest:calc(34px * var(--pool-scale));
    --p-qual:calc(30px * var(--pool-scale));
    --p-cue:calc(30px * var(--pool-scale));
    --p-adv:calc(26px * var(--pool-scale));
    --p-role:calc(20px * var(--pool-scale));
    --p-clock:calc(56px * var(--pool-scale));
    --p-drift:calc(28px * var(--pool-scale));
    --p-collapsed:calc(28px * var(--pool-scale));
    --p-of:calc(24px * var(--pool-scale));
    --p-btn:calc(30px * var(--pool-scale));    /* 17.6 arcmin at 70 cm */
    position:fixed;inset:0;z-index:var(--z-pool);
    overflow-y:auto;overscroll-behavior:contain;
    color-scheme:light;
    background:var(--p-paper);color:var(--p-ink);
    -webkit-user-select:none;user-select:none;touch-action:manipulation;
    /* Water pools along the bezel and produces ghost touches there, and the
       iOS system gesture strips live in those edges. Nothing tappable within
       16px of any edge. A fixed box is laid out against the viewport, so it
       names the insets itself. The top inset carries no extra padding: a
       sticky child resolves its offset against the padding box, so anything
       above it would be a gap the content scrolls through. */
    padding:env(safe-area-inset-top)
            max(var(--s-4),env(safe-area-inset-right))
            calc(env(safe-area-inset-bottom) + var(--s-6))
            max(var(--s-4),env(safe-area-inset-left));
  }
  /* Manual, off by default, never automatic. */
  #pool.night{
    --p-ink:#fff; --p-paper:#000; --p-done-fill:#1a1a1a;
    --p-behind-ink:#000; --p-behind-fill:#fff;
    color-scheme:dark;
  }
  #pool.big{ --pool-scale:1.2; }
  /* A hard guard so no future rule can leak the glass register onto the deck. */
  #pool *{-webkit-backdrop-filter:none !important;backdrop-filter:none !important;}

  /* 115px of the 763 usable: clock row 64, drift 36, padding and rule 15. */
  #pool .ptop{
    position:sticky;top:env(safe-area-inset-top);z-index:2;
    background:var(--p-paper);color:var(--p-ink);
    border-bottom:var(--p-border) solid var(--p-ink);
    padding:var(--s-4) 0 8px;margin-bottom:var(--s-3);
  }
  #pool .ptop .prow{display:flex;align-items:center;gap:var(--s-3);}
  /* 64px is the absolute floor in pool view. Close is reversible and it has
     to stay reachable without scrolling, so it takes the floor rather than
     the 76px a footer control gets. */
  #pool .ptop button{min-height:64px;font-size:var(--p-of);}
  #pool .clock{font-size:var(--p-clock);font-weight:700;line-height:1.05;
        font-variant-numeric:tabular-nums;}
  /* Behind schedule inverts rather than turning red. Red on white is the one
     thing glare eats first, and it says nothing to a colour-blind eye. */
  #pool .clock.behind{background:var(--p-behind-fill);color:var(--p-behind-ink);
        border-radius:8px;padding:0 8px;}
  #pool .of{font-size:var(--p-of);font-weight:600;flex:1 1 auto;}
  #pool .drift{font-size:var(--p-drift);font-weight:700;margin-top:2px;
        font-variant-numeric:tabular-nums;}
  #pool .drift.late{background:var(--p-behind-fill);color:var(--p-behind-ink);
        display:inline-block;padding:2px 12px;border-radius:var(--r-pill);}
  #pool .pgoal{font-size:var(--p-qual);font-weight:600;line-height:1.35;
        margin-bottom:var(--s-4);}

  #pool .pblk{
    width:100%;                 /* a <button> shrinks to fit without this */
    border:var(--p-border) solid var(--p-ink);border-radius:var(--r-pool);
    background:var(--p-paper);color:var(--p-ink);
    padding:var(--s-4);margin-bottom:var(--s-3);
    display:flex;gap:var(--s-4);align-items:stretch;text-align:left;
    -webkit-tap-highlight-color:transparent;
  }
  #pool .pblk .pmain{flex:1 1 auto;min-width:0;}
  #pool .prole{font-size:var(--p-role);font-weight:700;text-transform:uppercase;
        letter-spacing:.08em;}
  #pool .pcall{font-size:var(--p-call);line-height:1.15;font-weight:700;
        letter-spacing:.01em;margin-top:6px;hyphens:none;overflow-wrap:break-word;}
  #pool .prest{font-size:var(--p-rest);font-weight:700;line-height:1.3;margin-top:8px;
        font-variant-numeric:tabular-nums;}
  #pool .pqual{font-size:var(--p-qual);font-weight:600;line-height:1.35;margin-top:8px;}
  #pool .pcue{font-size:var(--p-cue);font-weight:600;line-height:1.35;margin-top:10px;}
  #pool .padv{font-size:var(--p-adv);font-weight:600;line-height:1.35;margin-top:8px;}

  /* Done is marked three ways, none of them colour: the tick fills, the call
     is struck through, and the card fill drops to #e8ecef, which keeps black
     text at 17.68 so it is decoration and never the signal. The old pale
     grey on near white measured 2.34, unreadable at arm's length. */
  #pool .pblk.done{background:var(--p-done-fill);border-color:var(--p-ink);color:var(--p-ink);}
  #pool .pblk.done .pcall{text-decoration:line-through;
        text-decoration-thickness:4px;text-decoration-color:var(--p-ink);}
  /* One block is open at a time. Opening another is reversible, so 76px is
     the right target here and the 104px tick stays the only state change. */
  #pool .pblk.collapsed{padding:var(--s-3) var(--s-4);align-items:center;
        min-height:var(--pool-target-sm);cursor:pointer;}
  #pool .pblk.collapsed:active{background:var(--p-done-fill);}
  #pool .pblk.collapsed .pcall{font-size:var(--p-collapsed);margin-top:2px;}
  #pool .pblk.collapsed .prest,
  #pool .pblk.collapsed .pqual,
  #pool .pblk.collapsed .pcue,
  #pool .pblk.collapsed .padv{display:none;}
  /* The word as well as the tick: three cues for done, none of them colour. */
  #pool .pblk .mk{font-size:var(--p-collapsed);font-weight:700;flex:none;
        white-space:nowrap;text-align:right;}

  /* The tick strip: 104px comes from the wet finger error budget. Four
     independent error sources at one sigma (wet capacitive centroid 3.0 mm,
     targeting at 70 cm 2.0 mm, one handed glance 1.5 mm, cold fingers 1.0
     mm) add in quadrature to 4.03 mm, and a 95% hit rate needs two times two
     sigma, so 16.1 mm, which is 102 CSS px. */
  #pool .ptick{
    flex:none;width:var(--pool-target);min-width:var(--pool-target);
    min-height:var(--pool-target);padding:0;
    border:var(--p-border) solid var(--p-ink);border-radius:var(--r-pool);
    background:var(--p-paper);color:var(--p-ink);
    display:flex;align-items:center;justify-content:center;
    font-size:52px;font-weight:700;line-height:1;
  }
  #pool .ptick.on{background:var(--p-ink);color:var(--p-paper);}
  #pool .ptick:active{background:var(--p-ink);color:var(--p-paper);transform:none;}
  #pool button{min-height:var(--pool-target-sm);font-size:var(--p-btn);font-weight:700;
        border:var(--p-border) solid var(--p-ink);border-radius:var(--r-pool);
        background:var(--p-paper);color:var(--p-ink);padding:0 var(--s-4);}
  #pool button:active{background:var(--p-ink);color:var(--p-paper);transform:none;}
  /* 48px apart, per the spacing rule in the error budget: one of these two
     changes state and the other does not. */
  #pool .pfoot{display:flex;gap:48px;margin-top:var(--s-6);}
  #pool .pfoot button{flex:1 1 0;}

  @media print{
    .topbar,.tabbar,.scrim,.sheet,#pool,button{display:none !important;}
    body{background:#fff;color:#000;}
    body>.wrap{padding:0;}
    .largetitle{font-size:24pt;}
    .card,.blk,.list-card,.tile,.tiles{box-shadow:none;border-color:#999;background:#fff;}
  }
</style>
</head>
<body>
<div class="topbar glass" id="topbar">
  <button class="barbtn gone" id="bar-left"></button>
  <div class="topbar-title" id="topbar-title"></div>
  <button class="barbtn gone" id="bar-right"></button>
</div>

<div class="wrap">
  <h1 class="largetitle" id="largetitle">W&amp;S Trainings</h1>
  <div id="app"></div>
</div>

<!-- The tab bar, the top bar, the scrim and the sheet frame are static markup,
     not built by the engine. The icons have to be inline SVG and h() cannot
     build SVG: document.createElement("svg") gives an HTMLUnknownElement. -->
<nav class="tabbar glass" id="tabbar" role="tablist">
  <button class="tab" id="tab-today" role="tab" aria-label="Today">
    <svg viewBox="0 0 28 28" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><rect x="4" y="6.5" width="20" height="17.5" rx="4"/><path d="M4 12h20M9.5 3.5v4M18.5 3.5v4"/></svg>
    <span class="lbl">Today</span>
  </button>
  <button class="tab" id="tab-history" role="tab" aria-label="History">
    <svg viewBox="0 0 28 28" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M14 8v6l4.5 2.5"/><path d="M4.5 14a9.5 9.5 0 1 0 3-6.9"/><path d="M4 4.5v3.6h3.6"/></svg>
    <span class="lbl">History</span>
  </button>
  <button class="tab" id="tab-library" role="tab" aria-label="Library">
    <svg viewBox="0 0 28 28" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><rect x="4" y="4.5" width="20" height="6" rx="2"/><rect x="4" y="12.5" width="20" height="6" rx="2"/><path d="M6.5 21.5h15"/></svg>
    <span class="lbl">Library</span>
  </button>
  <button class="tab" id="tab-insights" role="tab" aria-label="Insights">
    <svg viewBox="0 0 28 28" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M4.5 23.5h19"/><path d="M8 23.5V13M14 23.5V6.5M20 23.5v-6"/></svg>
    <span class="lbl">Insights</span>
  </button>
</nav>

<div class="scrim" id="scrim"></div>
<div class="sheet" id="sheet" role="dialog" aria-modal="true" aria-label="Options">
  <div class="grabber"></div>
  <div class="sheet-head" id="sheet-head"></div>
  <div class="sheet-body" id="sheet-body"></div>
</div>

<script src="config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script>
(function(){
  "use strict";

  // ==========================================================================

      else if (k.slice(0,2) === "on" && typeof v === "function") e.addEventListener(k.slice(2), v);
      else if (v === true) e.setAttribute(k, "");

  async function pageAll(table, order){
    var all = [], from = 0, page = 1000;
    for(;;){
      var q = sb.from(table).select("*");
      if (order) q = q.order(order.col, { ascending: !!order.asc });
      var r = await q.range(from, from + page - 1);
      if (r.error) throw r.error;
      all = all.concat(r.data || []);
      if (!r.data || r.data.length < page) break;
      from += page;
    }
    return all;
  }

  async function loadAll(){
    if (!sb || !session) return;
    var res = await Promise.all([
      sb.from("tr_focuses").select("*").order("sort_order"),
      sb.from("tr_games").select("*"),
      sb.from("tr_settings").select("*").eq("id",1).maybeSingle(),
      sb.from("tr_sessions").select("*").order("session_date",{ascending:false}).order("id",{ascending:false}).limit(200),
      sb.from("tr_coaches").select("*")
    ]);
    var bad = res.find(function(r){ return r.error; });
    if (bad) throw bad.error;

    data.games    = res[1].data || [];
    data.settings = res[2].data || defaultSettings();
    data.sessions = res[3].data || [];
    data.coaches  = res[4].data || [];
    data.library  = await pageAll("tr_exercises");

    // items for the sessions we might show or reopen
    var ids = data.sessions.slice(0, 40).map(function(s){ return s.id; });
    data.items = {};

      var it = await sb.from("tr_session_items").select("*").in("session_id", ids).order("position");
      if (it.error) throw it.error;
      (it.data || []).forEach(function(row){
